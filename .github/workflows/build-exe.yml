name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'launcher.py'
      - 'FormazioniPZZ.spec'
      - 'requirements.txt'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build EXE
        run: |
          python -m PyInstaller --clean FormazioniPZZ.spec
      
      - name: Copy to release folder
        run: |
          if (Test-Path "release\FormazioniPZZ.exe") {
            Remove-Item "release\FormazioniPZZ.exe"
          }
          Copy-Item "dist\FormazioniPZZ\FormazioniPZZ.exe" -Destination "release\"
          Remove-Item -Recurse -Force "build" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "dist" -ErrorAction SilentlyContinue
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/FormazioniPZZ.exe
          git diff --cached --quiet || (git commit -m "Build: aggiorna executable Windows" && git push)
