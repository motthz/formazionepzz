name: Build Windows executable

# Ad ogni push su main: compila e verifica, gli exe restano scaricabili come artifact.
# Su un tag vX.Y.Z: allega anche gli exe alla Release GitHub di quel tag
# (la crea se non esiste). Gli exe non vengono piu' salvati nel repository.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build portable executable
        run: python -m PyInstaller --clean --noconfirm FormazioniPZZ.spec

      - name: Build folder version (used by the installer, faster startup)
        run: python -m PyInstaller --clean --noconfirm FormazioniPZZ_dir.spec

      - name: Build installer
        run: python -m PyInstaller --clean --noconfirm installer/installer.spec

      - name: Upload executables artifact
        uses: actions/upload-artifact@v4
        with:
          name: FormazioniPZZ-windows
          path: |
            dist/FormazioniPZZ.exe
            dist/FormazioniPZZ_Setup.exe

      - name: Attach executables to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Formazioni PZZ $($tag.TrimStart('v'))" --generate-notes
          }
          gh release upload $tag dist/FormazioniPZZ_Setup.exe dist/FormazioniPZZ.exe --clobber
