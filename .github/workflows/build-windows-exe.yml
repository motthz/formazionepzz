name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm FormazioniPZZ.spec

      - name: Replace release executable
        shell: pwsh
        run: Copy-Item -Force dist/FormazioniPZZ.exe release/FormazioniPZZ.exe

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FormazioniPZZ-windows
          path: release/FormazioniPZZ.exe

      - name: Commit updated executable
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/FormazioniPZZ.exe
          if (git diff --cached --quiet) {
            Write-Host "Executable unchanged"
            exit 0
          }
          git commit -m "Build updated Windows executable"
          git push