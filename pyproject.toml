[project]
name = "formazioni-pzz"
dynamic = ["version"]
description = "Crea dossier PDF di formazione a partire da template Word, Excel e PDF"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# Errori veri (nomi non definiti, import inutili, sintassi) e ordine degli import
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Ordine degli import voluto: il percorso di sorgente va aggiunto prima di importare
"installer/installer.py" = ["E402"]
# Script di test storici, scritti in stile compatto: si controllano solo gli errori veri
"tests/legacy_*.py" = ["E4", "E7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Le chiamate COM a Word/Excel generano eccezioni Windows gia' gestite che
# faulthandler stamperebbe come "fatal exception" pur con test superati.
addopts = "-p no:faulthandler"
python_files = ["test_*.py"]
